name: 构建扩展

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "extension/manifest.json"
      - "extension/player/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4

      - name: 更新 NPM
        run: npm update

      - name: 安装 NPM 依赖
        run: npm install

      - name: 创建扩展
        run: npm run extension

      - name: 上传文件
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Old-Extension
          path: dist/**/*
          retention-days: 30
