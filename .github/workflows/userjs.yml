name: 构建用户脚本

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "userjs/manifest.json"
      - "extension/player/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build UserJS
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6

      - name: 更新 NPM
        run: npm update

      - name: 安装 NPM 依赖
        run: npm install

      - name: 创建脚本
        run: npm run userjs

      - name: 上传文件 (压缩包)
        uses: actions/upload-artifact@v7
        with:
          name: Bilibili-Old-UserJS
          path: userjs/main.user.js
          retention-days: 30
          compression-level: 9

      - name: 上传文件 (用户脚本)
        uses: actions/upload-artifact@v7
        with:
          path: userjs/main.user.js
          retention-days: 30
          archive: false
